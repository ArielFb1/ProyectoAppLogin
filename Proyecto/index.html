<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="capa-fondo">
    <div class="esfera esfera-1"></div>
    <div class="esfera esfera-2"></div>
    <div class="esfera esfera-3"></div>
  </div>
  <div class="superposicion-cuadricula"></div>

<!-- Logo / Marca -->
  <div class="tarjeta-login">
    <div class="marca">
      <div class="icono-marca">⬡</div>
      <span class="nombre-marca">Registro</span>
    </div>

    <h1 class="encabezado">Portal de Registro</h1>
    <p class="subencabezado">Ingresa tus credenciales para continuar</p>

    
    <div class="mensaje-error" id="mensajeError">Correo o contraseña incorrectos. Intenta de nuevo.</div>

    <form id="formularioLogin" novalidate>
      <div class="grupo-formulario">
        <label for="correo">Correo electrónico</label>
        <div class="contenedor-input">
          <input type="email" id="correo" placeholder="tu@correo.com" autocomplete="email">
          <svg class="icono-input" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
      </div>

      <div class="grupo-formulario">
        <label for="contrasena">Contraseña</label>
        <div class="contenedor-input">
          <input type="password" id="contrasena" placeholder="••••••••" autocomplete="current-password">
          <svg class="icono-input" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="boton-alternar-contrasena" id="botonOjo" title="Mostrar contraseña">
            <svg id="iconoOjo" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="fila-opciones">
        <label class="recordar">
          <input type="checkbox" id="recordar"> Recordarme
        </label>
        <a href="#" class="olvidaste">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="boton-login" id="botonLogin">
        <span class="texto-boton">Iniciar sesión</span>
        <div class="indicador-carga"></div>
      </button>
    </form>

    <div class="divisor">o continúa con</div>

    <div class="botones-sociales">
      <button class="boton-social">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Google
      </button>
      <button class="boton-social">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" class="icono icono-tabler icono-tabler-outline icono-tabler-marca-gmail"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M16 20h3a1 1 0 0 0 1 -1v-14a1 1 0 0 0 -1 -1h-3v16" /><path d="M5 20h3v-16h-3a1 1 0 0 0 -1 1v14a1 1 0 0 0 1 1" /><path d="M16 4l-4 4l-4 -4" /><path d="M4 6.5l8 7.5l8 -7.5" /></svg>
        Gmail
      </button>
    </div>

    <p class="texto-footer">¿No tienes cuenta? <a href="#">Regístrate gratis</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
